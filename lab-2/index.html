<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sapphire Store</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="m-0">
    <!-- Navbar -->
    <nav class="flex items-center justify-between gap-4 px-4 py-3 bg-gray-100">
      <div class="logo">
        <img class="w-16 h-auto" src="Logo.jpg" alt="Logo" />
      </div>

      <div
        class="links hidden md:flex items-center justify-center gap-6 flex-1"
      >
        <a class="text-gray-800 hover:text-blue-600" href="#">Home</a>
        <a class="text-gray-800 hover:text-blue-600" href="#">Products</a>
        <a class="text-gray-800 hover:text-blue-600" href="#">About</a>
        <a class="text-gray-800 hover:text-blue-600" href="#">Contact</a>
      </div>

      <div class="cart ml-auto md:ml-0">
        <img class="w-7 h-7" id="cart" src="cart.png" alt="cart logo" />
      </div>

      <div class="menu md:hidden">
        <img class="w-7 h-7" src="hamburger.svg" alt="" />
      </div>
    </nav>

    <div class="main-container max-w-7xl mx-auto px-4 py-8">
      <!-- Product Section -->
      <section>
        <h2 class="text-2xl font-bold text-center mb-6">Our Products</h2>

        <div
          class="products grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"
        >
          <div class="product border rounded-lg p-4 shadow-sm">
            <img
              class="w-full h-40 object-cover object-top rounded"
              src="product.webp"
              alt="Product 1"
            />
            <h3 class="text-lg font-semibold mt-3">Product 1</h3>
            <p class="text-gray-700 my-2">Price: $20</p>
            <button
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
              Add to Cart
            </button>
          </div>

          <div class="product border rounded-lg p-4 shadow-sm">
            <img
              class="w-full h-40 object-cover object-top rounded"
              src="product.webp"
              alt="Product 2"
            />
            <h3 class="text-lg font-semibold mt-3">Product 2</h3>
            <p class="text-gray-700 my-2">Price: $30</p>
            <button
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
              Add to Cart
            </button>
          </div>

          <div class="product border rounded-lg p-4 shadow-sm">
            <img
              class="w-full h-40 object-cover object-top rounded"
              src="product.webp"
              alt="Product 3"
            />
            <h3 class="text-lg font-semibold mt-3">Product 3</h3>
            <p class="text-gray-700 my-2">Price: $40</p>
            <button
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
              Add to Cart
            </button>
          </div>

          <div class="product border rounded-lg p-4 shadow-sm">
            <img
              class="w-full h-40 object-cover object-top rounded"
              src="product.webp"
              alt="Product 4"
            />
            <h3 class="text-lg font-semibold mt-3">Product 4</h3>
            <p class="text-gray-700 my-2">Price: $50</p>
            <button
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
              Add to Cart
            </button>
          </div>

          <div class="product border rounded-lg p-4 shadow-sm">
            <img
              class="w-full h-40 object-cover object-top rounded"
              src="product.webp"
              alt="Product 5"
            />
            <h3 class="text-lg font-semibold mt-3">Product 5</h3>
            <p class="text-gray-700 my-2">Price: $60</p>
            <button
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
              Add to Cart
            </button>
          </div>

          <div class="product border rounded-lg p-4 shadow-sm">
            <img
              class="w-full h-40 object-cover object-top rounded"
              src="product.webp"
              alt="Product 6"
            />
            <h3 class="text-lg font-semibold mt-3">Product 6</h3>
            <p class="text-gray-700 my-2">Price: $35</p>
            <button
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
              Add to Cart
            </button>
          </div>

          <div class="product border rounded-lg p-4 shadow-sm">
            <img
              class="w-full h-40 object-cover object-top rounded"
              src="product.webp"
              alt="Product 7"
            />
            <h3 class="text-lg font-semibold mt-3">Product 7</h3>
            <p class="text-gray-700 my-2">Price: $10</p>
            <button
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
              Add to Cart
            </button>
          </div>

          <div class="product border rounded-lg p-4 shadow-sm">
            <img
              class="w-full h-40 object-cover object-top rounded"
              src="product.webp"
              alt="Product 8"
            />
            <h3 class="text-lg font-semibold mt-3">Product 8</h3>
            <p class="text-gray-700 my-2">Price: $90</p>
            <button
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
              Add to Cart
            </button>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
