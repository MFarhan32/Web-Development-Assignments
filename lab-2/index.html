<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            <h2>MyStore</h2>
        </div>

        <div class="links">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

        <div class="cart">
            <span>&#128722;</span>
        </div>

        <div class="menu">
            <button type="button">&#9776;</button>
        </div>
    </nav>

    <!-- Product Section -->
    <section>
        <h2>Our Products</h2>

        <div class="products">

            <div class="product">
                <img src="https://placehold.co/200x150" alt="Product 1">
                <h3>Product 1</h3>
                <p>Price: $20</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://placehold.co/200x150" alt="Product 2">
                <h3>Product 2</h3>
                <p>Price: $30</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://placehold.co/200x150" alt="Product 3">
                <h3>Product 3</h3>
                <p>Price: $40</p>
                <button>Add to Cart</button>
            </div>

            <div class="product">
                <img src="https://placehold.co/200x150" alt="Product 4">
                <h3>Product 4</h3>
                <p>Price: $50</p>
                <button>Add to Cart</button>
            </div>

        </div>
    </section>

</body>
</html>
