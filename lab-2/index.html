<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sapphire Store</title>
  </head>
  <body>
    <!-- Navbar -->
    <nav>
      <div class="logo">
        <img src="Logo.jpg" alt="Logo" />
      </div>

      <div class="links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </div>

      <div class="cart">
        <img src="cart.png" alt="cart logo" />
      </div>

      <div class="menu">
        <img src="hamburger.svg" alt="" />
      </div>
    </nav>

    <div class="main-container">
      <!-- Product Section -->
      <section>
        <h2>Our Products</h2>

        <div class="products">
          <div class="product">
            <img src="https://placehold.co/200x150" alt="Product 1" />
            <h3>Product 1</h3>
            <p>Price: $20</p>
            <button>Add to Cart</button>
          </div>

          <div class="product">
            <img src="https://placehold.co/200x150" alt="Product 2" />
            <h3>Product 2</h3>
            <p>Price: $30</p>
            <button>Add to Cart</button>
          </div>

          <div class="product">
            <img src="https://placehold.co/200x150" alt="Product 3" />
            <h3>Product 3</h3>
            <p>Price: $40</p>
            <button>Add to Cart</button>
          </div>

          <div class="product">
            <img src="https://placehold.co/200x150" alt="Product 4" />
            <h3>Product 4</h3>
            <p>Price: $50</p>
            <button>Add to Cart</button>
          </div>

          <div class="product">
            <img src="https://placehold.co/200x150" alt="Product 5" />
            <h3>Product 5</h3>
            <p>Price: $60</p>
            <button>Add to Cart</button>
          </div>

          <div class="product">
            <img src="https://placehold.co/200x150" alt="Product 6" />
            <h3>Product 6</h3>
            <p>Price: $35</p>
            <button>Add to Cart</button>
          </div>

          <div class="product">
            <img src="https://placehold.co/200x150" alt="Product 7" />
            <h3>Product 7</h3>
            <p>Price: $10</p>
            <button>Add to Cart</button>
          </div>

          <div class="product">
            <img src="https://placehold.co/200x150" alt="Product 8" />
            <h3>Product 8</h3>
            <p>Price: $90</p>
            <button>Add to Cart</button>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
