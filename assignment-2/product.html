<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet" />
    <title>Product Page</title>
</head>
<body>
    <header>
        <nav class="flex h-auto justify-between">
            <a href="#">Home</a>
            <a href="#">Back to Menu</a>
        </nav>
    </header>

    <main>
        <div class="product-image"><img src="src/Mousse.jpg" alt="Cake Image"></div>
             <div
            class="product cursor-pointer p-4 bg-white flex-col flex items-center text-center rounded-3xl"
          >
            
            <h2 class="text-xl font-bold text-gray-800 mt-3 mb-2">Mousse</h2>
            <p class="text-gray-600 text-sm">
              The Lightest Chocolate Cake in Town! (Approximately 2.5 LBS)
            </p>
            <div class="instruction">
                <div>Instructions</div>
                <div>
                    <textarea name="" id="" placeholder="Any special Request?"></textarea>
                </div>
            </div>
            <button
              class="mt-3 bg-yellow-600 hover:bg-yellow-700 rounded-3xl p-2"
            >
              Add to Cart
            </button>
          
        </div>
    </main>
</body>
</html>
