<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layers Menu | Online Shopping</title>
    <link rel="icon" type="image/png" href="src/titlelogo.jpg" />
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body class="m-0 p-0 bg-gray-200">
    <header class="flex h-20 justify-around items-center bg-white">
      <div>
        <img class="h-7" src="src/name.png" alt="Layers" />
      </div>

      <div>
        <nav>
          <ul class="links flex justify-around w-30">
            <li>
              <img class="h-5" src="src/searchbar.png" alt="SearchIcon" />
            </li>
            <li>
              <img class="h-5" src="src/profile.png" alt="ProfileIcon" />
            </li>
            <li>
              <img class="h-5" src="src/cart.png" alt="CartIcon" />
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="mt-6" id="advertisement">
      <div class="flex h-100 items-center m-6">
        <div class="cursor-pointer border-none bg-[#b09c6d] w-11 h-20 rounded-full flex items-center justify-center"><img src="src/lessThan.svg" alt="" /></div>
        <div class="w-10/12 m-auto "><img class="rounded-2xl" src="src/cakes.png" alt="" /></div>
        <div class="cursor-pointer border-none bg-[#b09c6d] w-11 h-20 rounded-full flex items-center justify-center"><img src="src/greaterThan.svg" alt="" /></div>
      </div>
    </section>

    <section>
      <div class="h-12 flex gap-1 justify-center items-center bg-[#b09c6dee]" id="category">
        <span class="cursor-pointer hover:bg-yellow-800 m-1.5 px-4 py-1.5 rounded-full bg-gray-200 font-bold font-poppins">Cakes</span>
        <span class="cursor-pointer hover:bg-yellow-800 m-1.5 px-4 py-1.5 rounded-full bg-gray-200 font-bold font-poppins">Sundae</span>
        <span class="cursor-pointer hover:bg-yellow-800 m-1.5 px-4 py-1.5 rounded-full bg-gray-200 font-bold font-poppins">Cookies</span>
       
      </div>
    </section>
  </body>
</html>
